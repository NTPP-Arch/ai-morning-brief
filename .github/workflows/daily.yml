name: daily-brief

on:
  schedule:
    # 21:30 UTC = 05:30 北京时间：主触发。
    # 23:30 UTC = 07:30 北京时间：补触发，只在主触发丢了的时候真正干活（build_brief 有幂等保护）。
    # GitHub 的 schedule 首次注册可能延迟，也偶尔整体不触发，所以挂两个。
    - cron: "30 21 * * *"
    - cron: "30 23 * * *"
    - cron: "*/10 * * * *"   # 临时：验证 schedule 是否真的会触发，确认后删除
  workflow_dispatch:      # 手动触发，强制重写当天成稿

permissions:
  contents: write         # 提交成稿到 docs/，由 Pages 直接托管

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATE: ""            # 每步都会重算，这里只做占位，避免未定义变量报错
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取当日素材
        continue-on-error: true
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "抓取日期：$DATE"
          python scripts/fetch.py "$DATE"

      - name: 抽取文章正文（让素材从摘要变成全文）
        continue-on-error: true
        run: |
          python scripts/extract_articles.py "$DATE" --budget 300 || echo "正文抽取部分失败，继续用摘要"

      - name: 模型出稿
        continue-on-error: true
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/build_brief.py "$DATE" --force
          else
            python scripts/build_brief.py "$DATE"
          fi

      - name: 发布到 docs（今天没出稿就用最近一期兜底）
        if: always()
        run: |
          mkdir -p docs
          if [ -f "briefs/$DATE.html" ]; then
            cp "briefs/$DATE.html" docs/index.html
            cp "briefs/$DATE.html" "docs/$DATE.html"
            cp "briefs/$DATE.md"   "docs/$DATE.md" || true
            echo "已发布 $DATE"
          else
            LAST=$(ls -1t briefs/*.html 2>/dev/null | head -1 || true)
            if [ -n "$LAST" ]; then
              echo "::warning::今天出稿失败，用最近一期兜底：$LAST"
              cp "$LAST" docs/index.html
            else
              echo "::error::没有任何成稿可兜底"
              exit 1
            fi
          fi

      - name: 提交并由 Pages 发布
        if: always()
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add -A briefs docs
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 早报 ${DATE:-unknown}"
            git push
          fi
