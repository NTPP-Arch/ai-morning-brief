name: daily-brief

on:
  schedule:
    # 22:00 UTC = 次日 06:00 北京时间。
    # GitHub 定时任务在整点高峰期可能延迟几十分钟，所以留了余量；建议 06:30 后再打开页面。
    - cron: "0 22 * * *"
  workflow_dispatch:      # 手动触发，方便调试

permissions:
  contents: write         # 提交成稿到 docs/，由 Pages 直接托管

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取当日素材
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "抓取日期：$DATE"
          python scripts/fetch.py "$DATE"

      - name: 抽取文章正文（让素材从摘要变成全文）
        run: |
          python scripts/extract_articles.py "$DATE" --max 16 || echo "正文抽取部分失败，继续用摘要"

      - name: 模型出稿
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/build_brief.py "$DATE"
          mkdir -p docs
          cp "briefs/$DATE.html" docs/index.html
          cp "briefs/$DATE.html" "docs/$DATE.html"
          cp "briefs/$DATE.md"   "docs/$DATE.md" || true

      - name: 提交并由 Pages 发布
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add -A briefs docs
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 早报 $DATE"
            git push
          fi
